name: Play screenshots

# Throwaway phone captures for the Play listing. Not part of CI, and not run on main.
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/play-screenshots-6862

jobs:
  screenshots:
    name: play-screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Pillow for 24-bit PNGs
        run: python3 -m pip install --user --break-system-packages pillow

      - name: Build a debug APK for the emulator
        run: >
          dotnet build src/GpsTrainer.App/GpsTrainer.App.csproj
          -f net10.0-android
          -c Debug
          -p:AndroidPackageFormat=apk
          -p:RuntimeIdentifier=android-x64
          -p:EmbedAssembliesIntoApk=true
          -p:DefaultApiBaseUrl=http://10.0.2.2:5097

      - name: Start the local server
        run: |
          set -euo pipefail
          dotnet build src/GpsTrainer.Server/GpsTrainer.Server.csproj
          nohup dotnet run --project src/GpsTrainer.Server/GpsTrainer.Server.csproj --launch-profile http --no-build > /tmp/gpstrainer-server.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:5097/api/health >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          cat /tmp/gpstrainer-server.log
          exit 1

      - name: Create the throwaway emulator account
        run: bash scripts/android-seed.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot a 1080x1920 emulator and capture the phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          avd-name: playshots
          ram-size: 3072
          cores: 2
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          pre-emulator-launch-script: bash scripts/prepare-avd-display.sh
          script: bash scripts/play-screenshots.sh

      - name: Upload the Play screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-screenshots
          path: play-screenshots
          if-no-files-found: error
